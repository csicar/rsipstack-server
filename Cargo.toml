[package]
name = "rsipstack-server"
version = "0.2.0"
edition = "2021"
description = "A generic VoIP server library built on rsipstack"
license = "MIT"

[lib]
name = "rsipstack_server"
path = "src/lib.rs"

[[example]]
name = "echo_server"
path = "examples/echo_server.rs"

[features]
default = ["opus"]
opus = ["dep:opus"]
g722 = ["dep:audio-codec"]

[dependencies]
rsipstack = "0.5.24"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tracing = "0.1"
sdp-rs = "0.2"
rtp-rs = "0.6"
async-trait = "0.1"
if-addrs = "0.13"
rand = "0.8"
anyhow = "1.0"
opus = { version = "0.3", optional = true }
# Only G.722 is used; disable the crate's bundled Opus (we have our own).
audio-codec = { version = "0.4", default-features = false, features = ["std"], optional = true }
metrics = "0.24.6"
strum = { version = "0.28.0", features = ["derive"] }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["test-util"] }
